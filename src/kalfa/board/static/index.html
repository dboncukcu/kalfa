<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kalfa board</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='7'%20fill='%232a78d6'/%3E%3Crect%20x='5'%20y='17'%20width='9'%20height='9'%20rx='2'%20fill='white'/%3E%3Crect%20x='11.5'%20y='10.5'%20width='9'%20height='9'%20rx='2'%20fill='white'%20opacity='.8'/%3E%3Crect%20x='18'%20y='4'%20width='9'%20height='9'%20rx='2'%20fill='white'%20opacity='.6'/%3E%3C/svg%3E">
<script>
(function () {
  window.setTimeout(function () {
    if (window.kalfaMounted) return;
    var app = document.getElementById("app");
    if (app) app.textContent = "the board did not start within ten seconds: it needs the Vue module from cdn.jsdelivr.net, which this browser could not load";
  }, 10000);
  var theme = null;
  try {
    theme = window.localStorage.getItem("kalfa.theme");
  } catch (error) {
    theme = null;
  }
  if (theme === "light" || theme === "dark") document.documentElement.setAttribute("data-theme", theme);
})();
</script>
<link rel="stylesheet" href="/static/board.css">
<link rel="stylesheet" href="/static/charts.css">
<link rel="stylesheet" href="/static/diagram.css">
<link rel="stylesheet" href="/static/predictions.css">
</head>
<body>
<div id="app"><p class="loading">loading the board</p><noscript>kalfa board needs JavaScript and the Vue and Plotly scripts from cdn.jsdelivr.net</noscript></div>
<script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.35.2/plotly.min.js"></script>
<script type="module" src="/static/app.js"></script>
</body>
</html>
