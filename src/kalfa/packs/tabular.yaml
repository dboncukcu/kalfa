# /alias/kalfa/tabular: the base names plus the tables: the file sources, the splits, the column preprocessors, the data plots.
include: [/alias/kalfa/base]
alias:
  # source
  parquet: /source/kalfa/parquet
  csv: /source/kalfa/csv
  # split
  random_split: /split/kalfa/random
  kfold: /split/kalfa/kfold
  # pre
  max_abs_scaler: /pre/sklearn/max_abs_scaler
  robust_scaler: /pre/sklearn/robust_scaler
  quantile_transformer: /pre/sklearn/quantile_transformer
  power_transformer: /pre/sklearn/power_transformer
  asinh: /pre/kalfa/asinh
  sinh: /pre/kalfa/sinh
  tanh: /pre/kalfa/tanh
  atanh: /pre/kalfa/atanh
  logit: /pre/kalfa/logit
  kbins_discretizer: /pre/sklearn/kbins_discretizer
  spline_transformer: /pre/sklearn/spline_transformer
  # feed
  window: /feed/kalfa/window
  # layer
  polynomial: /layer/kalfa/polynomial
  l2_normalize: /layer/kalfa/l2_normalize
  # plot
  target_vs_features: /plot/kalfa/target_vs_features
  correlation_heatmap: /plot/kalfa/correlation_heatmap
  residuals: /plot/kalfa/residuals
  error_map: /plot/kalfa/error_map
  permutation_importance: /plot/kalfa/permutation_importance
  feature_distributions: /plot/kalfa/feature_distributions
  target_correlation: /plot/kalfa/target_correlation
  pairplot: /plot/seaborn/pairplot
  violin: /plot/seaborn/violin
  kde: /plot/seaborn/kde
  # data
  class_weights: /data/kalfa/class_weights
  target_weights: /data/kalfa/target_weights
  feature_width: /data/kalfa/feature_width
  feature_index: /data/kalfa/feature_index
