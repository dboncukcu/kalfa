include: [/alias/kalfa/tabular]

params: {epochs: 1, lr: 1.0e-2, seed: 3}

seed: $seed$

data:
  source: {uri: parquet, params: {path: housing.parquet}}
  split: {ratios: [0.7, 0.15, 0.15], seed: $seed$}
  batch: 128
  preprocessors:
    std: {uri: standard_scaler}
    target_std: {uri: standard_scaler}
  fields:
    "x*": {preprocessors: [std]}
    price: {target: true, preprocessors: [target_std]}
  feed: table

model:
  optimizer: {uri: adam, params: {lr: $lr$}}
  inputs: [x]
  outputs: [y]
  nodes:
    - {uri: linear_relu, params: {out_features: 16}}
    - {uri: linear, params: {out_features: 1}}

losses: {mse: {uri: mse}}
metrics: {rmse: {uri: rmse}}

training:
  turn: supervised
  loss: mse
  epochs: $epochs$
  checkpoint: {uri: best, params: {monitor: val/rmse}}
  report: best

plots: {loss_curve: {uri: loss_curve}}

record: runs/tiny_$datetime$
