[project]
name = "kalfa"
version = "3.0.0.dev0"
description = "YAML and Python front end for PyTorch training: a thin kernel, plain torch leaves, rules as patches, a record directory every tool reads"
readme = "README.md"
license = "MIT"
authors = [{ name = "dboncukcu" }]
requires-python = ">=3.11"
keywords = ["ml", "yaml", "pytorch", "experiments"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "ruamel.yaml>=0.18",
    "numpy>=1.26",
    "torch>=2.2",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "pillow>=10.0",
    "textual>=8.2",
    "optuna>=3.6",
    "onnx>=1.16",
    "tensorboard>=2.16",
    "rich>=13.0",
]

[project.urls]
Homepage = "https://github.com/dboncukcu/kalfa"
Repository = "https://github.com/dboncukcu/kalfa"
Issues = "https://github.com/dboncukcu/kalfa/issues"

[project.scripts]
kalfa = "kalfa.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kalfa"]

[tool.hatch.build.targets.sdist]
exclude = ["docs/images"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -p no:cacheprovider"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::UserWarning", "error::ResourceWarning"]
markers = [
    "slow: trains a model for a few turns",
    "subprocess: spawns kalfa in a child process",
    "asyncio: runs a coroutine test (textual)",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["kalfa", "helpers"]
lines-after-imports = 2
