[project]
name = "kalfa"
version = "0.2.1"
description = "YAML front end for PyTorch training: config sections compiled through cirak templates onto tezgah pipelines"
readme = "README.md"
license = "MIT"
authors = [{ name = "dboncukcu" }]
requires-python = ">=3.13"
keywords = ["ml", "yaml", "pytorch", "pipeline", "cirak", "tezgah"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "tezgah>=0.2.0",
    "cirak>=0.2.2",
    "ruamel.yaml>=0.18",
    "torch>=2.2",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "scikit-learn>=1.4",
    "torchmetrics>=1.3",
    "tqdm>=4.66",
    "matplotlib>=3.8",
    "pillow>=10.0",
    "scipy>=1.12",
]

[project.urls]
Homepage = "https://github.com/dboncukcu/kalfa"
Repository = "https://github.com/dboncukcu/kalfa"
Issues = "https://github.com/dboncukcu/kalfa/issues"

[project.scripts]
kalfa = "kalfa.cli:main"

[project.entry-points."cirak.plugins"]
kalfa = "kalfa"

[project.optional-dependencies]
sweep = [
    "optuna>=3.6",
]

[dependency-groups]
dev = [
    "optuna>=3.6",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kalfa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    # assertions read a parameter or a loss with float(); the library itself detaches (kalfa.std.metric.as_float)
    "ignore:Converting a tensor with requires_grad=True to a scalar",
]
