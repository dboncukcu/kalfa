data:
  use: table
  file: housing.parquet
  split: [0.7, 0.15, 0.15]
  features: {"x*": standard_scaler}
  targets: {price: standard_scaler}
  batch: 128
models:
  net: {use: mlp, hidden: [64], out: 1}
losses:
  mse: mse
metrics:
  rmse: rmse
optimizers:
  main: {use: adam, lr: 1.0e-3, over: "@models.net", minimizes: "@losses.mse"}
train:
  epochs: 20
record: runs/minimal_$datetime$
