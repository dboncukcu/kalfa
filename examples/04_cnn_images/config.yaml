seed: 7
data:
  use: image_folder
  folder: data/pets
  split: [0.7, 0.15, 0.15]
  transform:
    - {use: resize, size: [32, 32]}
    - to_tensor
    - {use: normalize, mean: imagenet}
  train_transform:
    - {use: resize, size: [36, 36]}
    - {use: random_crop, size: 32}
    - random_flip
    - to_tensor
    - {use: normalize, mean: imagenet}
  batch: {size: 16, eval_size: 256}
models:
  net:
    use: cnn_legos.Classifier
    backbone: {use: cnn_legos.Backbone, width: 16}
    n_classes: "@data.n_classes"
    freeze: ["backbone.*"]
losses: {ce: cross_entropy}
metrics: {accuracy: accuracy}
optimizers:
  main:
    use: adamw
    lr: 1.0e-3
    over:
      - {of: "@models.net", match: "backbone.*", lr: 1.0e-4}
      - "@models.net"
    minimizes: "@losses.ce"
train:
  epochs: 20
  step: {use: supervised, amp: true, grad_clip: 1.0}
  checkpoint: {watch: val/accuracy, mode: max}
  report: best
rules:
  unfreeze:
    when: {use: after_epoch, at: 3}
    set: {models.net.freeze: false}
plots:
  loss_curve: loss_curve
  confusion: confusion_matrix
record: runs/pets_$datetime$
