include: [data.yaml]
models:
  net: {use: distill_legos.Classifier, width: 32, n_classes: "@data.n_classes"}
losses: {ce: cross_entropy}
optimizers:
  main:
    use: sgd
    lr: 0.1
    momentum: 0.9
    weight_decay: 5.0e-4
    over: "@models.net"
    minimizes: "@losses.ce"
    schedule: {use: cosine, steps: 360}
train:
  epochs: 60
  checkpoint: {watch: val/accuracy, mode: max}
  report: best
record: runs/teacher
