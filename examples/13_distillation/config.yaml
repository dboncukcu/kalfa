include: [data.yaml]
params:
  temperature: 4.0
  alpha: 0.7
  teacher_run: runs/teacher
models:
  teacher:
    use: distill_legos.Classifier
    width: 32
    n_classes: "@data.n_classes"
    weights: {run: $teacher_run$, model: net, which: best}
    freeze: true
  student: {use: distill_legos.Classifier, width: 8, n_classes: "@data.n_classes"}
losses:
  kd: {use: distill, student: "@models.student", teacher: "@models.teacher", temperature: $temperature$, alpha: $alpha$}
optimizers:
  main: {use: adamw, lr: 1.0e-3, over: "@models.student", minimizes: "@losses.kd"}
train:
  epochs: 40
  predicts: "@models.student"
  checkpoint: {watch: val/accuracy, mode: max}
  report: best
rules:
  cool_down:
    when: {use: above, watch: val/accuracy, value: 0.90}
    set: {optimizers.main.lr: 1.0e-4}
  stop:
    when: {use: plateau, watch: val/accuracy, mode: max, patience: 6}
    stop: true
plots:
  loss_curve: {use: loss_curve, series: [train/kd/ce, train/kd/kl, val/accuracy]}
  confusion: confusion_matrix
record: runs/distill_$datetime$
