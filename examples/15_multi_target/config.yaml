seed: 7
data:
  use: table
  file: plant.parquet
  split: [0.7, 0.15, 0.15]
  features: {"x*": standard_scaler}
  targets: {yield: standard_scaler, moisture: standard_scaler, defects: ~}
  batch: 128
models:
  net:
    use: multihead_legos.MultiHead
    hidden: [128, 128]
    heads: {y_yield: 1, y_moisture: 1, y_defects: 1}
    outputs: [y_yield, y_moisture, y_defects]
losses:
  l_yield: {use: mse, pred: y_yield, target: yield}
  l_moisture: {use: torch.nn.HuberLoss, pred: y_moisture, target: moisture}
  l_defects: {use: poisson_nll, pred: y_defects, target: defects}
  total:
    use: weighted_sum
    terms:
      - {of: "@losses.l_yield", weight: 1.0}
      - {of: "@losses.l_moisture", weight: 0.5}
      - {of: "@losses.l_defects", weight: 0.2}
metrics:
  rmse_yield: {use: rmse, pred: y_yield, target: yield}
  rmse_moisture: {use: rmse, pred: y_moisture, target: moisture}
optimizers:
  main: {use: adam, lr: 1.0e-3, over: "@models.net", minimizes: "@losses.total"}
train:
  epochs: 60
  checkpoint: {watch: val/total}
  report: best
rules:
  rebalance:
    when: {use: after_epoch, at: 20}
    set:
      losses.total.terms[2].weight: 0.5
plots:
  loss_curve: {use: loss_curve, series: [train/total, val/rmse_yield, val/rmse_moisture]}
  pred_vs_true: {use: pred_vs_true, pairs: {y_yield: yield, y_moisture: moisture}}
record: runs/plant_$datetime$
