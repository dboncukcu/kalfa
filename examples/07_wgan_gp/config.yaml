params:
  epochs: 60
  lr: 1.0e-4
  latent: 128
seed: 7
data:
  use: image_folder
  folder: data/faces
  split: [0.9, 0.1, 0.0]
  transform: [to_tensor, {use: normalize, mean: 0.5, std: 0.5}]
  batch: {size: 32, drop_last: true}
models:
  generator:
    use: gan_legos.Generator
    latent: $latent$
    n_classes: "@data.n_classes"
    inputs: [z, label]
    ema: 0.999
    init: {use: normal_init, std: 0.02}
  critic:
    use: gan_legos.Critic
    n_classes: "@data.n_classes"
    inputs: [image, label]
    init: {use: normal_init, std: 0.02}
losses:
  d: {use: wgan_gp_d, generator: "@models.generator", critic: "@models.critic", latent: $latent$, real: image,
      label: label, gp_weight: 10, on: [train]}
  g: {use: wgan_g, generator: "@models.generator", critic: "@models.critic", latent: $latent$, label: label}
metrics:
  fid: {use: fid, model: "@models.generator.ema", latent: $latent$, real: image, label: label, n: 90, every: 5,
        on: [valid]}
optimizers:
  d: {use: adam, lr: $lr$, betas: [0.0, 0.9], over: "@models.critic", minimizes: "@losses.d"}
  g: {use: adam, lr: $lr$, betas: [0.0, 0.9], over: "@models.generator", minimizes: "@losses.g"}
train:
  epochs: $epochs$
  step: {use: alternating, order: [d, g], repeat: {d: 5, g: 1}, fresh_batch: true}
  checkpoint: {watch: val/fid}
  report: best
rules:
  samples:
    when: {use: every, epochs: 5}
    once: false
    run: {use: write_samples, sampler: "@generate", n: 16}
generate: {use: gan_sampler, model: "@models.generator.ema", latent: $latent$, n_classes: "@data.n_classes", n: 64}
plots:
  loss_curve: {use: loss_curve, series: [train/d, train/g, val/fid]}
  samples: {use: samples_grid, n: 64}
record: runs/wgan_$datetime$
