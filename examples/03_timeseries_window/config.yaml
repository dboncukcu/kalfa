params: {size: 168, horizon: 24, epochs: 30}
seed: 7
data:
  use: table
  file: energy.parquet
  split: {use: sequential, ratios: [0.7, 0.15, 0.15], group: site_id}
  features: {"x*": standard_scaler}
  targets: {load: standard_scaler}
  feed: {use: window, size: $size$, horizon: $horizon$, context: true, group: site_id}
  batch: 64
models:
  net:
    use: stack
    layers:
      - {use: torch.nn.GRU, input_size: "@data.n_features", hidden_size: 64, batch_first: true}
      - last_step
      - {use: linear, out_features: $horizon$}
losses: {mse: mse}
metrics: {rmse: rmse}
optimizers:
  main: {use: adam, lr: 1.0e-3, over: "@models.net", minimizes: "@losses.mse"}
train:
  epochs: $epochs$
  checkpoint: {watch: val/rmse}
  report: best
plots:
  loss_curve: loss_curve
  forecast: {use: forecast_samples, n: 4}
record: runs/energy_$datetime$
