params: {latent: 4, epochs: 60, lr: 2.0e-4}
seed: 42
data:
  use: table
  file: anomaly_data.parquet
  filter:
    all: "(is_anomaly > -4) & (is_anomaly < 4)"
    train: "is_anomaly == 0"
  split: [0.7, 0.1, 0.2]
  drop: [xx6, xx7]
  features:
    "x?": [abs, {use: log, base: 10, norm: 1200}, standard_scaler]
    "xx*": [abs, {use: log, base: 10, norm: 1200}, standard_scaler]
  targets: {is_anomaly: ~}
  batch: 50
models:
  encoder: {use: alad_legos.Mlp, in_features: "@data.n_features", hidden: [64, 64], out_features: $latent$, skip: true}
  generator: {use: alad_legos.Mlp, in_features: $latent$, hidden: [64, 64], out_features: "@data.n_features",
              init: {use: normal_init, std: 0.02}}
  dxz: {use: alad_legos.Dxz, x_dim: "@data.n_features", z_dim: $latent$, width: 32, init: {use: normal_init, std: 0.02}}
  dxx: {use: alad_legos.Dxx, x_dim: "@data.n_features", width: 64, outputs: [logit, feature],
        init: {use: normal_init, std: 0.02}}
  dzz: {use: alad_legos.Dzz, z_dim: $latent$, width: 32, init: {use: normal_init, std: 0.02}}
  score: {use: alad_legos.AnomalyScore, encoder: "@models.encoder", generator: "@models.generator", dxx: "@models.dxx"}
losses:
  adv_d: {use: alad_legos.AladD, encoder: "@models.encoder", generator: "@models.generator", dxz: "@models.dxz",
          dxx: "@models.dxx", dzz: "@models.dzz", latent: $latent$, x: x, on: [train]}
  adv_g: {use: alad_legos.AladG, encoder: "@models.encoder", generator: "@models.generator", dxz: "@models.dxz",
          dxx: "@models.dxx", dzz: "@models.dzz", latent: $latent$, x: x, on: [train]}
metrics:
  auroc: {use: auroc, pred: score, target: is_anomaly}
  average_precision: {use: average_precision, pred: score, target: is_anomaly}
optimizers:
  g: {use: adam, lr: $lr$, betas: [0.5, 0.999], over: ["@models.encoder", "@models.generator"],
      minimizes: "@losses.adv_g"}
  d: {use: adam, lr: $lr$, betas: [0.5, 0.999], over: ["@models.dxz", "@models.dxx", "@models.dzz"],
      minimizes: "@losses.adv_d"}
train:
  epochs: $epochs$
  step: {use: alternating, order: [d, g]}
  predicts: "@models.score"
plots:
  score_histogram: alad_legos.score_histogram
  roc: alad_legos.roc
  pr_curve: alad_legos.pr_curve
record: runs/alad_$datetime$
