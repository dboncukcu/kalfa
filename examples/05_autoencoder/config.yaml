seed: 7
data:
  use: image_folder
  folder: data/digits
  split: [0.8, 0.1, 0.1]
  labels: false
  transform: [to_tensor]
  batch: 16
models:
  ae: {use: ae_legos.AutoEncoder, latent: 32, outputs: [x_hat, z]}
losses:
  mse: {use: mse, pred: x_hat, target: image}
metrics:
  recon: {use: rmse, pred: x_hat, target: image}
optimizers:
  main: {use: adam, lr: 1.0e-3, over: "@models.ae", minimizes: "@losses.mse"}
train:
  epochs: 30
  checkpoint: {watch: val/recon}
  report: best
generate: {use: latent_sampler, model: "@models.ae.decoder", latent: 32, n: 64}
plots:
  loss_curve: loss_curve
  pairs: {use: image_pairs, n: 8}
  samples: {use: samples_grid, n: 64}
record: runs/ae_$datetime$
