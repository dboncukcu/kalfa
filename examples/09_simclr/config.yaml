seed: 7
data:
  use: image_folder
  folder: data/unlabeled
  split: [0.8, 0.1, 0.1]
  labels: false
  train_transform:
    - use: two_views
      each:
        - {use: random_crop, size: 16, padding: 2}
        - random_flip
        - to_tensor
  transform: [to_tensor]
  batch: {size: 64, drop_last: true}
models:
  encoder: {use: simclr_legos.Encoder, width: 32, outputs: [h]}
  projector: {use: mlp, hidden: [128], out: 32, in_features: 32, inputs: [h]}
losses:
  ntxent: {use: ntxent, encoder: "@models.encoder", projector: "@models.projector", views: image, temperature: 0.5,
           on: [train]}
optimizers:
  main:
    use: adamw
    lr: 1.0e-3
    over: ["@models.encoder", "@models.projector"]
    minimizes: "@losses.ntxent"
    schedule: {use: cosine, steps: 400}
train:
  epochs: 50
  step: {use: supervised, amp: true}
  predicts: "@models.encoder"
  checkpoint: {every: 10}
plots:
  loss_curve: loss_curve
record: runs/simclr_$datetime$
