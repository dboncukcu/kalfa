seed: 7
data:
  use: table
  file: churn.parquet
  split: [0.7, 0.15, 0.15]
  features:
    "num_*": standard_scaler
    "cat_*": one_hot
  targets: {churned: label}
  batch: 64
models:
  net: {use: mlp, hidden: [64, 32], out: "@data.n_classes"}
losses:
  ce: {use: cross_entropy, weight: "@data.class_weights"}
metrics:
  accuracy: accuracy
  f1: {use: f1, average: macro}
optimizers:
  main: {use: adamw, lr: 1.0e-3, weight_decay: 1.0e-4, over: "@models.net", minimizes: "@losses.ce"}
train:
  epochs: 40
  checkpoint: {watch: val/f1, mode: max}
  report: best
rules:
  stop: {when: {use: plateau, watch: val/f1, mode: max, patience: 8}, stop: true}
plots:
  loss_curve: loss_curve
  confusion: confusion_matrix
record: runs/churn_$datetime$
