params:
  seq_len: 64
  total_steps: 1000
  turn_updates: 100
  warmup: 50
seed: 7
data:
  use: text_lines
  file: data/corpus.txt
  tokenizer: char
  seq_len: $seq_len$
  split: [0.9, 0.05, 0.05]
  batch: 64
models:
  lm: {use: gpt_legos.GPT, vocab_size: "@data.vocab_size", seq_len: $seq_len$, layers: 4, dim: 128, heads: 4}
losses:
  ce: {use: cross_entropy, target: targets}
metrics:
  ppl: {use: perplexity, target: targets}
optimizers:
  main:
    use: adamw
    lr: 6.0e-4
    betas: [0.9, 0.95]
    weight_decay: 0.1
    over: "@models.lm"
    minimizes: "@losses.ce"
    schedule: {use: cosine, warmup: $warmup$, steps: $total_steps$}
train:
  updates: {total: $total_steps$, turn: $turn_updates$}
  step: {use: supervised, amp: true, grad_clip: 1.0}
  checkpoint: {watch: val/ppl}
  report: best
generate:
  use: lm_sampler
  model: "@models.lm"
  tokenizer: "@data.tokenizer"
  prompt: "ROMEO:"
  max_new_tokens: 400
  temperature: 0.8
plots:
  loss_curve: loss_curve
  samples: samples_grid
record: runs/charlm_$datetime$
