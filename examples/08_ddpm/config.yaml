params:
  epochs: 60
  diffusion_steps: 300
seed: 7
data:
  use: image_folder
  folder: data/patches
  split: [0.9, 0.1, 0.0]
  transform: [random_flip, to_tensor, {use: normalize, mean: 0.5, std: 0.5}]
  batch: {size: 64, drop_last: true}
models:
  unet: {use: unet_legos.UNet, channels: 64, steps: $diffusion_steps$, ema: 0.9999}
losses:
  ddpm: {use: ddpm, model: "@models.unet", x: image, schedule: {use: cosine_beta, steps: $diffusion_steps$}}
optimizers:
  main:
    use: adamw
    lr: 2.0e-4
    over: "@models.unet"
    minimizes: "@losses.ddpm"
    schedule: {use: warmup, steps: 80}
train:
  epochs: $epochs$
  predicts: false
  step: {use: supervised, amp: true, grad_clip: 1.0}
  checkpoint: {every: 10}
generate: {use: ddpm_sampler, model: "@models.unet.ema", schedule: "@losses.ddpm.schedule", shape: [3, 16, 16], n: 64,
           steps: 50}
plots:
  loss_curve: loss_curve
  samples: {use: samples_grid, n: 64}
record: runs/ddpm_$datetime$
