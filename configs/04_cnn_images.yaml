# 04: image classification with a pretrained backbone. Per sample transforms in preprocessors (augment on the train set only:
# sets: [train]), the class balancing sampler batch.balanced, the backbone a separate model frozen at first
# (trainable: false), a rule opens it at the end of epoch five (set: {backbone.trainable: true}), a per layer group learning
# rate with the optimizer's groups, the prediction is a composite model (classifier: backbone plus head, no parameters of its own).

include:
  - /alias/kalfa/vision

plugins:
  - timm_legos

params:
  epochs: 20
  lr: 1.0e-3
  backbone_lr: 1.0e-5
  unfreeze_at: 5
  seed: 7

seed: $seed$
device: cuda                      # a device lego (auto | cpu | cuda | mps | {uri, params}); an unavailable device is an error

data:
  source: {uri: image_folder, params: {path: data/pets}}
  split: {ratios: [0.9, 0.1, 0.0], seed: $seed$}
  batch: {size: 64, eval_size: 256, balanced: true}
  preprocessors:
    resize:    {uri: resize, params: {size: 224}}
    to_tensor: {uri: to_tensor}
    augment:   {uri: random_crop_flip, params: {size: 224}, sets: [train]}
    normalize: {uri: normalize, params: {mean: imagenet, std: imagenet}}
  fields:
    image: {preprocessors: [resize, augment, to_tensor, normalize]}
    label: {target: true}
  feed: table

model:
  models:
    backbone:
      optimizer: main
      trainable: false
      inputs: [image]
      outputs: [feature]
      nodes:
        - {uri: timm_backbone, params: {name: resnet50, pretrained: true, pooled: true}}
    head:
      optimizer: main
      inputs: [feature]
      outputs: [logits]
      nodes:
        - {uri: linear, params: {out_features: 37}}
    classifier:
      inputs: [image]
      outputs: [logits]
      nodes:
        feature: {model: backbone, inputs: [image]}
        logits:  {model: head, inputs: [feature]}

metrics:
  accuracy: {uri: accuracy}

losses:
  ce: {uri: cross_entropy}

optimizers:
  main:
    uri: adamw
    params: {lr: $lr$, groups: [{match: "backbone.*", lr: $backbone_lr$}]}
    loss: ce

training:
  turn: supervised
  predicts: classifier
  epochs: $epochs$
  rules:
    - name: unfreeze
      when: {uri: after_epoch, params: {at: $unfreeze_at$}}
      set: {backbone.trainable: true}
  stop:
    - {uri: plateau, params: {monitor: val/accuracy, mode: max, patience: 4}}
  checkpoint: {uri: best, params: {monitor: val/accuracy, mode: max}}
  report: best

plots:
  loss_curve: {uri: loss_curve}
  confusion:  {uri: confusion_matrix}

record: runs/pets_$datetime$
