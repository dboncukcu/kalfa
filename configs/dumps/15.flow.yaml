# Generated by kalfa 0.2.1 (cirak 0.2.0) from configs/15_multi_target.yaml: kalfa check --dump, the flow the
# templates of src/kalfa/templates/kalfa.yaml open for the driver document configs/dumps/15.recipe.yaml.
# Regenerate with: uv run python tests/fixtures/regenerate_dumps.py
# Sections: components (the recipe's component tables), blocks (spec and graph blocks as templates;
# the flow blocks are opened inside flow), flow (the expanded flow with every output written out;
# the comments are tezgah's resolution: implicit bindings, pattern matches, derived reads and exports).
components:
  losses:
    l_y: {uri: /adapter/kalfa/criterion, params: {criterion: {uri: /criterion/kalfa/mse}}}
    l_z: {uri: /adapter/kalfa/criterion, params: {criterion: {uri: /criterion/kalfa/mse}}}
    l_tail: {uri: /adapter/kalfa/criterion, params: {criterion: {uri: /criterion/kalfa/bce_logits, params: {pos_weight: 5.0}}}}
    total: {uri: /objective/kalfa/weighted_sum, params: {terms: {l_y: 1.0, l_z: 1.0, l_tail: 0.5}}}
  metrics:
    rmse_y: {uri: /adapter/kalfa/metric, params: {metric: {uri: /metric/kalfa/rmse}}}
    rmse_z: {uri: /adapter/kalfa/metric, params: {metric: {uri: /metric/kalfa/rmse}}}
    auroc_tail: {uri: /adapter/kalfa/metric, params: {metric: {uri: /metric/torchmetrics/binary_auroc}}}
  triggers:
    stop_0: {uri: /trigger/kalfa/plateau, params: {monitor: val/rmse_z, patience: 8}}
  plots:
    loss_curve: {uri: /plot/kalfa/loss_curve}
    pred_vs_true: {uri: /plot/kalfa/pred_vs_true}
  progress: {uri: /lego/kalfa/progress}
blocks:
  head:
    inputs: [x]
    outputs: [y_hat]
    spec:
    - {uri: /layer/kalfa/linear_relu, params: {out_features: 64}}
    - {uri: /layer/kalfa/linear, params: {out_features: 3}}
  combine:
    inputs: [y_hat]
    outputs: [z_hat]
    spec:
    - {uri: /layer/kalfa/linear_relu, params: {out_features: 32}}
    - {uri: /layer/kalfa/linear, params: {out_features: 1}}
  tail:
    inputs: [x]
    outputs: [tail_logit]
    spec:
    - {uri: /layer/kalfa/linear_relu, params: {out_features: 32}}
    - {uri: /layer/kalfa/linear, params: {out_features: 1}}
  full:
    inputs: [x]
    outputs: [y_hat, z_hat, tail_logit]
    graph:
      y_hat: {model: head, inputs: [x]}
      z_hat: {model: combine, inputs: [y_hat]}
      tail_logit: {model: tail, inputs: [x]}
flow:
  outputs: [history, predictions]
  data:  # reads: record; exports: prep, train_loader, valid_loader, test_loader
    source: {uri: /source/kalfa/parquet, params: {path: scores.parquet}, outputs: [df_0]}
    split: {uri: /split/kalfa/random, params: {ratios: [0.7, 0.15, 0.15], seed: 7}, inputs: {df: df_0}, outputs: {train: train_df_0, valid: valid_df_0, test: 
          test_df_0}}
    set_filter_train: {uri: /lego/kalfa/filter_set, params: {set: train, filters: []}, inputs: {df: train_df_0}, outputs: [train_df]}
    set_filter_valid: {uri: /lego/kalfa/filter_set, params: {set: valid, filters: []}, inputs: {df: valid_df_0}, outputs: [valid_df]}
    set_filter_test: {uri: /lego/kalfa/filter_set, params: {set: test, filters: []}, inputs: {df: test_df_0}, outputs: [test_df]}
    prep: {uri: /lego/kalfa/fit, params: {fields: {y_*: {target: true, preprocessors: [y_scaler]}, z: {target: true, preprocessors: [y_scaler]}, z_tail: {target: 
              true, preprocessors: [to_float]}, x*: {preprocessors: [x_scaler]}}, preprocessors: {x_scaler: {uri: /pre/sklearn/standard_scaler}, y_scaler: {uri: 
              /pre/sklearn/standard_scaler}, to_float: {uri: /pre/kalfa/cast, params: {dtype: float32}}}, drop: [], keys: {x_scaler: {}, y_scaler: {}, to_float: {}}},
      inputs: {df: train_df}, outputs: [prep]}  # implicit: record
    frame_train: {uri: /lego/kalfa/apply, params: {set: train, keys: {x_scaler: {}, y_scaler: {}, to_float: {}}}, inputs: {df: train_df, prep: prep}, outputs: [
          train_frame]}
    frame_valid: {uri: /lego/kalfa/apply, params: {set: valid, keys: {x_scaler: {}, y_scaler: {}, to_float: {}}}, inputs: {df: valid_df, prep: prep}, outputs: [
          valid_frame]}
    frame_test: {uri: /lego/kalfa/apply, params: {set: test, keys: {x_scaler: {}, y_scaler: {}, to_float: {}}}, inputs: {df: test_df, prep: prep}, outputs: [
          test_frame]}
    feed_train: {uri: /feed/kalfa/table, inputs: {frame: train_frame, frames: {train: train_frame, valid: valid_frame, test: test_frame}}, outputs: [train_data]}
    feed_valid: {uri: /feed/kalfa/table, inputs: {frame: valid_frame, frames: {train: train_frame, valid: valid_frame, test: test_frame}}, outputs: [valid_data]}
    feed_test: {uri: /feed/kalfa/table, inputs: {frame: test_frame, frames: {train: train_frame, valid: valid_frame, test: test_frame}}, outputs: [test_data]}
    loader_train: {uri: /loader/kalfa/torch, params: {set: train, batch: {size: 256}}, inputs: {data: train_data}, outputs: [train_loader]}
    loader_valid: {uri: /loader/kalfa/torch, params: {set: valid, batch: {size: 256}}, inputs: {data: valid_data}, outputs: [valid_loader]}
    loader_test: {uri: /loader/kalfa/torch, params: {set: test, batch: {size: 256}}, inputs: {data: test_data}, outputs: [test_loader]}
  models: # reads: prep, train_loader; exports: head, combine, tail, models, emas, composites
    build_head: {block: head, builder: /builder/kalfa/module, params: {seed: 7, index: 0, init: null, trainable: true, weights: null}, outputs: [head]}  # implicit: prep, train_loader
    build_combine: {block: combine, builder: /builder/kalfa/module, params: {seed: 7, index: 1, init: null, trainable: true, weights: null}, outputs: [combine]} # implicit: prep, train_loader
    build_tail: {block: tail, builder: /builder/kalfa/module, params: {seed: 7, index: 2, init: null, trainable: true, weights: null}, outputs: [tail]} # implicit: prep, train_loader
