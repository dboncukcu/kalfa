        outputs:
          models: models_final
          optimizers: optimizers_final
          emas: emas_final
          counters: counters_final
          rules: rules_final
        body:  # reads: rules, models, optimizers, emas, counters, composites, train_loader, device, prep, record, valid_loader, test_loader, turn_index; exports: models_next, optimizers_next, emas_next, counters_next, metrics, rules_next, stop
          effects: {uri: /rule/kalfa/effects, inputs: {rules: rules}, outputs: [effects]}
          turn: {uri: /turn/kalfa/alternating, params: {params: {}, extra: {}, losses: '@losses', metrics: '@metrics', losses_keys: {l_y: {output: y_hat, target: 
                    y_*}, l_z: {output: z_hat, target: z}, l_tail: {output: tail_logit, target: z_tail}, total: {}}, metrics_keys: {rmse_y: {output: y_hat, 
                    target: y_*}, rmse_z: {output: z_hat, target: z}, auroc_tail: {output: tail_logit, target: z_tail}}, predicts: full, steps: null}, inputs: {
                models: models, optimizers: optimizers, emas: emas, counters: counters, composites: composites, effects: effects, loader: train_loader}, outputs: {
              models: models_next, optimizers: optimizers_next, emas: emas_next, counters: counters_next, metrics: train_metrics}}  # implicit: device, prep, record
          evaluate_valid: {uri: /lego/kalfa/evaluate, params: {set: valid, losses: '@losses', metrics: '@metrics', losses_keys: {l_y: {output: y_hat, target: 
                    y_*}, l_z: {output: z_hat, target: z}, l_tail: {output: tail_logit, target: z_tail}, total: {}}, metrics_keys: {rmse_y: {output: y_hat, 
                    target: y_*}, rmse_z: {output: z_hat, target: z}, auroc_tail: {output: tail_logit, target: z_tail}}, predicts: full}, inputs: {models: 
                models_next, emas: emas_next, composites: composites, counters: counters_next, effects: effects, loader: valid_loader}, outputs: [valid_metrics]} # implicit: device, prep, record
          evaluate_test: {uri: /lego/kalfa/evaluate, params: {set: test, losses: '@losses', metrics: '@metrics', losses_keys: {l_y: {output: y_hat, target: y_*},
                l_z: {output: z_hat, target: z}, l_tail: {output: tail_logit, target: z_tail}, total: {}}, metrics_keys: {rmse_y: {output: y_hat, target: y_*}, 
